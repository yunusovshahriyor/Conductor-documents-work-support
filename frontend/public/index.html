<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faf8">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Проводник</title>
  <noscript><meta http-equiv="refresh" content="0; url=ru/"></noscript>
  <script>
    // Static hosting has no server, so pick the language in the browser: saved choice, then device language, then Russian.
    (function () {
      var supported = ["tg", "ru", "uz", "ky"];
      var lang = "ru";
      try {
        var m = document.cookie.match(/(?:^|; )provodnik-locale=([a-z]{2})/);
        if (m && supported.indexOf(m[1]) > -1) lang = m[1];
        else {
          var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ru"];
          for (var i = 0; i < list.length; i++) {
            var c = String(list[i]).toLowerCase().split("-")[0];
            if (supported.indexOf(c) > -1) { lang = c; break; }
          }
        }
      } catch (e) {}
      var base = location.pathname.replace(/index\.html$/, "").replace(/\/?$/, "/");
      location.replace(base + lang + "/" + location.search + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
